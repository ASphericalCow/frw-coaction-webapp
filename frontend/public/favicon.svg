<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="4" refX="4.5" refY="2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,2 L0,4 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Gray Δ glyph — centred inside the acyclic 3-gon -->
  <text x="50" y="71"
        text-anchor="middle"
        font-size="42"
        font-family="Georgia, 'Times New Roman', serif"
        fill="#aaaaaa">⊗</text>

  <!-- Acyclic directed graph: T→BR, T→BL, BR→BL -->
  <!-- Nodes: T=(50,18)  BR=(84,76)  BL=(16,76)  r=8 -->
  <!-- T→BL: full edge vertex-to-vertex (no arrow) -->
  <line x1="50" y1="18" x2="16" y2="76" stroke="black" stroke-width="4.5"/>
  <!-- T→BL: arrowhead at 60% drawn on top -->
  <line x1="50" y1="18" x2="29.6" y2="52.8" stroke="black" stroke-width="4.5" marker-end="url(#arrow)"/>
  <!-- T→BR: double edge — two parallel lines offset ±3 along perpendicular (-0.862, 0.505) -->
  <line x1="51.4" y1="26.5" x2="77.4" y2="70.5" stroke="black" stroke-width="3.5"/>
  <line x1="56.6" y1="23.5" x2="82.6" y2="67.5" stroke="black" stroke-width="3.5"/>
  <!-- BR→BL: dashed edge -->
  <line x1="76" y1="76" x2="24" y2="76" stroke="black" stroke-width="4.5"
        stroke-dasharray="6.8 4.5"/>

  <!-- Vertices -->
  <circle cx="50" cy="18" r="8" fill="black"/>
  <circle cx="84" cy="76" r="8" fill="black"/>
  <circle cx="16" cy="76" r="8" fill="black"/>
</svg>
